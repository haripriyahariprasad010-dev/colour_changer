<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="color-card">
        <h1>Color Picker</h1>
        <p class="description">Pick a color and let your creativity bloom.</p>
            <div class="picker-section">
                <label for="colorPicker">Choose your color</label>
                <input type="color" id="colorPicker" value="#cbedda" oninput="
                document.body.style.backgroundColor = this.value;
                document.querySelector('.color-code code').textContent = this.value.toUpperCase()">
                </div>
                <div class="color-code"><span>Current color</span><code>#CBEDDA</code>
                </div>
            </main>
</body>
</html>
